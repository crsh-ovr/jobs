# Vetted company allowlist. Adding a company = one PR editing this file.
# See CONTRIBUTING.md for how to find the ATS + identifier.
#
# Fields:
#   name         display name (required)
#   ats          adapter key: ashby | greenhouse | lever | rippling | gem | getro (required)
#   identifier   the board slug/token for that ATS (required; case-sensitive for Ashby)
#   industry     one or more of: cybersecurity, deftech, cspm, finops, grc (required)
#   tier         featured | standard   (featured pins to the top; default standard)
#   relationship worked | known | watchlist  (Shane's affinity bucket; orders the board)
#   homepage     optional company URL
#
# Every entry below was verified by curling the company's live public board.

